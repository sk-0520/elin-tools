name: Build Works

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "<Build> Application"

    runs-on: ubuntu-latest

    steps:
      - name: <Checkout> Repository
        uses: actions/checkout@v4

      - name: <Restore> .next/cache
        if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: |
            ${{ github.job }}-${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: <Add> Node/NPM
        uses: actions/setup-node@v4
        with:
          node-version-file: ./.node-version
          cache: npm

      - name: <Install> NPM
        shell: bash
        run: npm ci

      - name: <Lint> front-end
        shell: bash
        run: npm run lint

      - name: <Test> front-end
        shell: bash
        run: npm run test

      - name: <Env> default
        if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master'
        shell: bash
        run: |
          echo "NODE_ENV=development" >> ${GITHUB_ENV}
          cp .env.template .env.development

      - name: <Env> develop
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          echo "NODE_ENV=production" >> ${GITHUB_ENV}
          echo "#staging" > .env.production
          echo "NEXT_PUBLIC_EXECUTION=staging" >> .env
          echo "NEXT_PUBLIC_DEFAULT_STORAGE=local" >> .env

      - name: <Env> prodction
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          echo "NODE_ENV=production" >> ${GITHUB_ENV}
          echo "#prodction" > .env.production
          echo "NEXT_PUBLIC_EXECUTION=prodction" >> .env
          echo "NEXT_PUBLIC_DEFAULT_STORAGE=local" >> .env

      - name: <Build> front-end
        shell: bash
        run: |
          echo "env.NODE_ENV:${{ env.NODE_ENV }}"
          echo "NODE_ENV: $NODE_ENV"
          npm run build
        env:
          NODE_ENV: ${{ env.NODE_ENV }}

      - name: <Artifact> front-end
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: <Artifact> coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  deplay-github-pages:
    name: "<Deplay> Github Pages"
    needs:
      - build

    if: github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: <Deploy> GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
